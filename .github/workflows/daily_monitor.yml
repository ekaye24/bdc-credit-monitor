name: BDC Daily Credit Monitor

on:
  schedule:
    # Runs at 12:00 UTC (8:00 AM EDT) Monday through Friday
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from the web UI

jobs:
  run-surveillance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Credit Monitor Script
        env:
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python main.py
